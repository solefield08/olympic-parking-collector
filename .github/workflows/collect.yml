name: Collect Parking Data

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect-parking
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    env:
      PARKING_API_KEY: ${{ secrets.PARKING_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Validate Secrets
        run: |
          for v in PARKING_API_KEY SUPABASE_URL SUPABASE_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is not set"
              exit 1
            fi
          done

      - name: Run Collector
        run: python collector.py --once
